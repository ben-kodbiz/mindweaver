[project]
name = "mindweaver-api"
version = "0.1.0"
description = "MindWeaver local-first knowledge application API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "reportlab>=4.2",
    "ruff>=0.8",
]

[project.optional-dependencies]
docling = ["docling>=2"]
ocr = ["pillow>=11", "pypdfium2>=4", "rapidocr>=3"]
embeddings = ["sentence-transformers>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindweaver"]
